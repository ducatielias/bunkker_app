<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bunkr Searcher</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/feather-icons/dist/feather.min.js"></script>
    <script src="https://unpkg.com/feather-icons"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#ef4444',
                        secondary: '#4b5563'
                    }
                }
            }
        }
    </script>
</head>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

body {
    font-family: 'Inter', sans-serif;
}

/* Smooth transitions for hover effects */
a, button {
    transition: all 0.2s ease;
}

/* Custom scrollbar */
::-webkit-scrollbar {
    width: 8px;
}

::-webkit-scrollbar-track {
    background: #f1f1f1;
}

::-webkit-scrollbar-thumb {
    background: #ef4444;
    border-radius: 4px;
}

::-webkit-scrollbar-thumb:hover {
    background: #dc2626;
}
/* Animation for the search results and options */
@keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
}

.result-card, .search-option {
    animation: fadeIn 0.3s ease forwards;
}

.search-option {
    cursor: pointer;
}

.search-option:hover {
    transform: translateY(-2px);
    box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
}
</style>
<body class="bg-gray-50 min-h-screen flex flex-col">
    <custom-header></custom-header>
    
    <main class="flex-1 container mx-auto px-4 py-8">
        <section class="max-w-3xl mx-auto">
            <div class="bg-white rounded-xl shadow-md overflow-hidden p-6 mb-8">
                <h1 class="text-3xl font-bold text-primary mb-2">Bunkr Searcher</h1>
                <p class="text-secondary mb-6">Find what you're looking for on Bunkr</p>
                <form id="searchForm" class="flex gap-2">
                    <input 
                        type="text" 
                        id="searchInput" 
                        placeholder="Search on Bunkr..." 
                        class="flex-1 px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent"
                        required
                    >
                    <button 
                        type="submit" 
                        class="bg-primary hover:bg-red-600 text-white px-6 py-2 rounded-lg transition-colors flex items-center gap-2"
                    >
                        <i data-feather="search"></i>
                        Search
                    </button>
                </form>

                <div id="searchOptions" class="hidden mt-4 flex flex-wrap gap-3">
                    <button class="search-option bg-white border border-gray-200 hover:border-primary text-gray-700 hover:text-primary px-4 py-2 rounded-lg flex items-center gap-2 transition-all" data-site="bunkr">
                        <i data-feather="image"></i>
                        Bunkr Albums
                    </button>
                    <button class="search-option bg-white border border-gray-200 hover:border-primary text-gray-700 hover:text-primary px-4 py-2 rounded-lg flex items-center gap-2 transition-all" data-site="yandex">
                        <i data-feather="search"></i>
                        Yandex
                    </button>
                    <button class="search-option bg-white border border-gray-200 hover:border-primary text-gray-700 hover:text-primary px-4 py-2 rounded-lg flex items-center gap-2 transition-all" data-site="google">
                        <i data-feather="globe"></i>
                        Google
                    </button>
                    <button class="search-option bg-white border border-gray-200 hover:border-primary text-gray-700 hover:text-primary px-4 py-2 rounded-lg flex items-center gap-2 transition-all" data-site="bing">
                        <i data-feather="compass"></i>
                        Bing
                    </button>
                    <button class="search-option bg-white border border-gray-200 hover:border-primary text-gray-700 hover:text-primary px-4 py-2 rounded-lg flex items-center gap-2 transition-all" data-site="vk">
                        <i data-feather="users"></i>
                        VK
                    </button>
										<button class="search-option bg-white border border-gray-200 hover:border-primary text-gray-700 hover:text-primary px-4 py-2 rounded-lg flex items-center gap-2 transition-all" data-site="telegram">
                        <i data-feather="users"></i>
                        Telegram
                    </button>
</div>
</div>
            
            <div id="resultsContainer" class="space-y-4 hidden">
                <h2 class="text-2xl font-semibold text-primary">Search Results</h2>
                <div id="resultsList" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"></div>
                <div id="loadingIndicator" class="text-center py-8 hidden">
                    <div class="inline-block animate-spin rounded-full h-8 w-8 border-t-2 border-b-2 border-primary"></div>
                    <p class="mt-2 text-secondary">Searching...</p>
                </div>
                <div id="noResults" class="text-center py-12 hidden">
                    <i data-feather="alert-circle" class="w-12 h-12 text-red-400 mx-auto mb-4"></i>
                    <p class="text-lg text-secondary">No results found. Try another search term.</p>
                </div>
            </div>
        </section>
    </main>

    <custom-footer></custom-footer>

    <script src="components/header.js"></script>
    <script src="components/footer.js"></script>
    <script>
		document.addEventListener('DOMContentLoaded', () => {
    const searchForm = document.getElementById('searchForm');
    const searchInput = document.getElementById('searchInput');
    const resultsContainer = document.getElementById('resultsContainer');
    const resultsList = document.getElementById('resultsList');
    const loadingIndicator = document.getElementById('loadingIndicator');
    const noResults = document.getElementById('noResults');
    const searchOptions = document.getElementById('searchOptions');
    let currentQuery = '';

    // Show search options when form is submitted
    searchForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        
        currentQuery = searchInput.value.trim();
        if (!currentQuery) return;
        
        // Show search options
        searchOptions.classList.remove('hidden');
        searchOptions.scrollIntoView({ behavior: 'smooth' });
    });

    // Handle search option clicks
    document.querySelectorAll('.search-option').forEach(button => {
        button.addEventListener('click', () => {
            const site = button.dataset.site;
            let url = '';
            
            switch(site) {
                case 'bunkr':
                    url = `https://bunkr-albums.io/?search=${encodeURIComponent(currentQuery)}`;
                    break;
                case 'yandex':
                    url = `https://yandex.com/search/?text=${encodeURIComponent(currentQuery)}`;
                    break;
                case 'google':
                    url = `https://www.google.com/search?q=${encodeURIComponent(currentQuery)}`;
                    break;
                case 'bing':
                    url = `https://www.bing.com/search?q=${encodeURIComponent(currentQuery)}`;
                    break;
								case 'vk':
                    url = `https://vk.com/search?q=${encodeURIComponent(currentQuery)}`;
                    break;
								case 'telegram':
                    url = `https://tgsearch.su/?post_type=tg_channel&s=${encodeURIComponent(currentQuery)}`;
                    break;
            }
            
            if (url) {
                window.open(url, '_blank');
            }
        });
    });
});
		</script>
    <script>
        feather.replace();
    </script>
<script src="https://huggingface.co/deepsite/deepsite-badge.js"></script>
</body>
</html>
