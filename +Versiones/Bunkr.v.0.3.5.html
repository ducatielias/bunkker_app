<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Mi Dashboard</title>
  <style>
    /* === Reset & iOS Base === */
    :root {
      --bg-color: #f2f2f7;
      --card-bg: #ffffff;
      --text-main: #1c1c1e;
      --text-secondary: #8e8e93;
      --blue-ios: #007aff;
      --red-ios: #ff3b30;
      --purple-ios: #af52de;
      --search-bg: #e3e3e8;
    }
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      overflow-x: hidden;
      padding-bottom: 40px;
    }

    /* === Header & Buscador (Estilo Spotlight) === */
    .header-container {
      position: sticky;
      top: 0;
      background: rgba(242, 242, 247, 0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      z-index: 100;
      padding: 20px 16px 10px;
    }
    .search-wrapper {
      position: relative;
      width: 100%;
    }
    .search-input {
      width: 100%;
      background-color: var(--search-bg);
      border: 2px solid transparent;
      border-radius: 12px;
      padding: 12px 12px 12px 40px;
      font-size: 17px;
      color: var(--text-main);
      outline: none;
      transition: all 0.3s ease;
    }
    .search-input::placeholder { color: var(--text-secondary); }
    
    .search-input.secret-mode {
      background-color: #ffffff;
      border-color: var(--purple-ios);
      box-shadow: 0 0 8px rgba(175, 82, 222, 0.3);
      color: var(--purple-ios);
    }
    .search-input.secret-mode::placeholder { color: #d0a3ec; }

    .search-icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-secondary);
      width: 18px; height: 18px;
    }
    .search-input.secret-mode ~ .search-icon { color: var(--purple-ios); }

    .search-clear {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: #c7c7cc;
      color: white;
      border: none;
      border-radius: 50%;
      width: 18px; height: 18px;
      font-size: 12px;
      display: none;
      align-items: center; justify-content: center;
      cursor: pointer;
    }
    .search-input.secret-mode ~ .search-clear { background: var(--purple-ios); }

    /* === Resultados de Búsqueda === */
    #searchOptions {
      display: none;
      margin: 0 16px;
    }
    #searchOptions.show {
      display: block;
    }
    .ios-list {
      background: var(--card-bg);
      border-radius: 14px;
      overflow: hidden;
      margin-bottom: 20px;
    }
    .ios-list-item {
      display: flex;
      align-items: center;
      padding: 12px 16px;
      border-bottom: 0.5px solid #e5e5ea;
      cursor: pointer;
      font-size: 17px;
      color: var(--blue-ios);
    }
    .ios-list-item:last-child { border-bottom: none; }
    .ios-list-item img {
      width: 24px; height: 24px; border-radius: 4px; margin-right: 12px;
    }
    .ios-list-item.secret-item { color: var(--purple-ios); }

    /* === Tarjetas y Cuadrícula (Cards & Grids) === */
    .section-title {
      font-size: 20px;
      font-weight: 700;
      color: var(--text-main);
    }
    
    .category-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 24px 16px 10px;
    }
    .category-title-wrapper {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
    }
    .chevron {
      font-size: 12px;
      color: var(--text-secondary);
      transition: transform 0.2s ease;
    }
    .chevron.collapsed {
      transform: rotate(-90deg);
    }

    .ios-card {
      background: var(--card-bg);
      border-radius: 18px;
      margin: 0 16px 20px;
      padding: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    }
    
    .app-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(70px, 1fr));
      gap: 16px 10px;
    }
    .app-icon-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-decoration: none;
      color: var(--text-main);
      cursor: pointer;
    }
    .app-icon {
      width: 54px;
      height: 54px;
      background: var(--search-bg);
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 6px;
      overflow: hidden;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      transition: transform 0.1s;
    }
    .app-icon:active { transform: scale(0.9); }
    .app-icon img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .app-label {
      font-size: 11px;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 100%;
    }

    /* === Weather Widget === */
    .weather-widget .aviso {
      padding: 12px 0;
      border-bottom: 0.5px solid #e5e5ea;
      text-align: left;
    }
    .weather-widget .aviso:last-child { border-bottom: none; }
    .nivel-rojo { color: var(--red-ios); font-weight: 600; font-size: 15px;}
    .nivel-naranja { color: #ff9500; font-weight: 600; font-size: 15px;}
    .nivel-amarillo { color: #ffcc00; font-weight: 600; font-size: 15px;}
    .weather-footer {
      margin-top: 12px;
      font-size: 12px;
      color: var(--text-secondary);
      text-align: center;
      border-top: 0.5px solid #e5e5ea;
      padding-top: 10px;
    }

    /* === Ajustes Básicos (Botones y Listas) === */
    .ios-btn {
      background: var(--search-bg);
      color: var(--blue-ios);
      border: none;
      padding: 10px 16px;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      margin-bottom: 10px;
      transition: background 0.2s;
    }
    .ios-btn:active { background: #d1d1d6; }

    textarea {
      width: 100%; height: 120px;
      border: 1px solid #e5e5ea; border-radius: 10px;
      padding: 10px; font-size: 14px; font-family: monospace;
      margin-bottom: 10px; outline: none;
    }

    /* Lista Gestor de Buscadores */
    .engine-list-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 0.5px solid #e5e5ea;
    }
    .engine-list-item:last-child { border-bottom: none; }
    .engine-info { display: flex; align-items: center; gap: 10px; }
    .engine-info img { width: 20px; height: 20px; border-radius: 4px; }
    .engine-actions button {
      background: none; border: none; font-size: 16px; margin-left: 10px; cursor: pointer;
    }
    .badge-secret {
      background: var(--purple-ios); color: white; font-size: 10px; padding: 2px 6px; border-radius: 6px; font-weight: bold;
    }
  </style>
</head>
<body>

  <header class="header-container">
    <div class="search-wrapper">
      <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
      <input type="text" id="searchInput" class="search-input" placeholder="Buscar..." autocomplete="off" autocapitalize="off" spellcheck="false" />
      <button class="search-clear" id="searchClear">✕</button>
    </div>
  </header>

  <div id="searchOptions">
    <div class="category-header" style="margin-top: 0;">
      <h2 class="section-title">Buscar en...</h2>
    </div>
    <div class="ios-list" id="searchEnginesList"></div>
  </div>

  <div id="mainContent">
    
    <div class="category-header">
      <div class="category-title-wrapper" onclick="toggleCategory('widget_aemet')">
        <h2 class="section-title">Avisos AEMET</h2>
        <span class="chevron" id="chev_widget_aemet">▼</span>
      </div>
    </div>
    <div class="ios-card weather-widget" id="cat_widget_aemet">
      <div id="avisos-lista" style="text-align: center; color: var(--text-secondary); font-size: 14px;">Cargando avisos...</div>
      <div class="weather-footer">Provincia de Alicante · <a href="https://www.aemet.es" target="_blank" style="color:var(--blue-ios); text-decoration:none;">AEMET</a></div>
    </div>

    <div id="linksContainer"></div>

    <div class="category-header">
      <h2 class="section-title">Ajustes</h2>
    </div>
    <div class="ios-card">
      <button class="ios-btn" onclick="addCategory()">+ Añadir Nueva Categoría</button>
      <button class="ios-btn" id="toggleEnginesBtn">🔍 Gestionar Buscadores</button>
      <button class="ios-btn" id="toggleExportBtn">📦 Exportar / Importar Datos</button>
      
      <div id="enginesSection" style="display: none; margin-top: 15px; border-top: 1px solid #e5e5ea; padding-top: 15px;">
        <h3 style="font-size: 16px; margin-bottom: 10px;">Mis Buscadores</h3>
        <div id="enginesEditorList" style="margin-bottom: 15px;"></div>
        <button class="ios-btn" onclick="addSearchEngine()" style="background: var(--blue-ios); color: white;">+ Añadir Buscador</button>
      </div>

      <div id="exportSection" style="display: none; margin-top: 15px; border-top: 1px solid #e5e5ea; padding-top: 15px;">
        <textarea id="dataTextarea" placeholder="Pega aquí el código JSON para importar..."></textarea>
        <button class="ios-btn" id="exportBtn">⬇️ Generar código de mi configuración</button>
        <button class="ios-btn" id="importBtn">⬆️ Sobrescribir con texto importado</button>
        <p id="importStatus" style="font-size: 12px; color: var(--text-secondary); text-align: center;"></p>
      </div>
    </div>

  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      
      // ==========================
      // 🔹 DATOS POR DEFECTO
      // ==========================
      const DEFAULT_LINKS = {
        "Tiempo": [
          { id: crypto.randomUUID(), title: "AEMET", url: "http://www.aemet.es/es/eltiempo/prediccion/municipios/torremanzanas-torre-de-les-macanes-la-id03132" },
          { id: crypto.randomUUID(), title: "Windy", url: "https://www.windy.com/38.607/-0.419?38.533,-0.376,11" },
          { id: crypto.randomUUID(), title: "Ventusky", url: "https://www.ventusky.com/es/radar-mapa#p=38.591;-0.421;11" }
        ],
        "Información extra": [
          { id: crypto.randomUUID(), title: "Meteored", url: "https://www.meteored.com/es/" },
          { id: crypto.randomUUID(), title: "Sismos", url: "https://visualizadores.ign.es/tproximos" }
        ],
        "Tráfico y Noticias": [
          { id: crypto.randomUUID(), title: "DGT", url: "https://infocar.dgt.es/etraffic/" },
          { id: crypto.randomUUID(), title: "Google News", url: "https://news.google.com/home?hl=es&gl=ES&ceid=ES:es" }
        ]
      };

      const DEFAULT_ENGINES = [
        { id: 'google', name: 'Google', url: 'https://www.google.com/search?q={q}', domain: 'google.com', secret: false },
        { id: 'brave', name: 'Brave Search', url: 'https://search.brave.com/search?q={q}', domain: 'search.brave.com', secret: false },
        { id: 'openstreetmap', name: 'Mapas (OSM)', url: 'https://www.openstreetmap.org/search?query={q}', domain: 'openstreetmap.org', secret: false },
        { id: 'vk', name: 'VK', url: 'https://vk.com/search?q={q}', domain: 'vk.com', secret: true },
        { id: 'telegram', name: 'Telegram', url: 'https://tgsearch.su/?s={q}', domain: 'tgsearch.su', secret: true },
        { id: 'archive', name: 'Archive Org', url: 'https://archive.org/search?query={q}', domain: 'archive.org', secret: true }
      ];

      // Cargar Enlaces
      function loadLinks() {
        const saved = localStorage.getItem('customLinks');
        if (saved) {
          try { return JSON.parse(saved).categories || DEFAULT_LINKS; } catch (e) {}
        }
        return DEFAULT_LINKS;
      }
      function saveLinks(categories) {
        localStorage.setItem('customLinks', JSON.stringify({ version: 2, categories }));
        renderLinks();
      }

      // Cargar Buscadores
      function loadSearchEngines() {
        const saved = localStorage.getItem('customEngines');
        if (saved) {
          try { return JSON.parse(saved); } catch (e) {}
        }
        return DEFAULT_ENGINES;
      }
      function saveSearchEngines(engines) {
        localStorage.setItem('customEngines', JSON.stringify(engines));
        updateSearchUI();
        renderSearchEnginesEditor();
      }

      // ==========================
      // 🔹 LÓGICA DE COLAPSAR/EXPANDIR
      // ==========================
      window.toggleCategory = (catId) => {
        const card = document.getElementById(`cat_${catId}`);
        const chevron = document.getElementById(`chev_${catId}`);
        if (!card) return;
        
        if (card.style.display === 'none') {
          card.style.display = 'block';
          chevron.classList.remove('collapsed');
          localStorage.setItem(`collapsed_${catId}`, 'false');
        } else {
          card.style.display = 'none';
          chevron.classList.add('collapsed');
          localStorage.setItem(`collapsed_${catId}`, 'true');
        }
      };

      function applyCollapseState(catId) {
        const isCollapsed = localStorage.getItem(`collapsed_${catId}`) === 'true';
        if (isCollapsed) {
          document.getElementById(`cat_${catId}`).style.display = 'none';
          document.getElementById(`chev_${catId}`).classList.add('collapsed');
        }
      }

      // ==========================
      // 🔹 RENDERIZADO DE ENLACES
      // ==========================
      function renderLinks() {
        const categories = loadLinks();
        const container = document.getElementById('linksContainer');
        let html = '';

        Object.entries(categories).forEach(([catName, links]) => {
          const catId = catName.replace(/\s+/g, '_'); // Crear ID seguro sin espacios
          
          html += `
            <div class="category-header">
              <div class="category-title-wrapper" onclick="toggleCategory('${catId}')">
                <h2 class="section-title">${catName}</h2>
                <span class="chevron" id="chev_${catId}">▼</span>
              </div>
              <span style="font-size:22px; color:var(--blue-ios); cursor:pointer; padding: 0 5px;" onclick="addLink('${catName}')">＋</span>
            </div>
            
            <div class="ios-card" id="cat_${catId}">
              <div class="app-grid">
          `;
          
          if (links.length === 0) {
            html += `<p style="color:var(--text-secondary); font-size:13px; grid-column: 1/-1;">No hay enlaces.</p>`;
          }

          links.forEach(link => {
            const domain = new URL(link.url).hostname;
            const iconUrl = `https://www.google.com/s2/favicons?domain=${domain}&sz=64`;
            
            html += `
              <div class="app-icon-wrapper">
                <a href="${link.url}" target="_blank" class="app-icon" title="${link.title}">
                  <img src="${iconUrl}" onerror="this.style.display='none'; this.parentElement.innerText='${domain.charAt(0).toUpperCase()}'; this.parentElement.style.color='#fff'; this.parentElement.style.fontSize='24px'; this.parentElement.style.background='#8e8e93';">
                </a>
                <span class="app-label" onclick="editLink('${catName}', '${link.id}')">${link.title}</span>
              </div>
            `;
          });
          
          html += `
              </div>
              <div style="margin-top: 15px; text-align:right;">
                <button onclick="deleteCategory('${catName}')" style="background:none; border:none; color:var(--red-ios); font-size:12px; cursor:pointer;">Eliminar sección</button>
              </div>
            </div>
          `;
        });
        
        container.innerHTML = html;
        
        // Restaurar estado de colapso de cada tarjeta
        Object.keys(categories).forEach(catName => {
          applyCollapseState(catName.replace(/\s+/g, '_'));
        });
      }

      // Funciones CRUD Enlaces
      window.addLink = (cat) => {
        const title = prompt(`Título en "${cat}":`, '');
        if (!title) return;
        const url = prompt(`URL (ej: https://...):`, 'https://');
        if (!url || !url.startsWith('http')) return alert('URL inválida.');
        const c = loadLinks();
        c[cat].push({ id: crypto.randomUUID(), title, url });
        saveLinks(c);
      };
      
      window.editLink = (cat, id) => {
        const c = loadLinks();
        const link = c[cat].find(l => l.id === id);
        if(!link) return;
        const action = confirm(`¿Quieres editar "${link.title}"?\n\n[Aceptar] = Editar\n[Cancelar] = Eliminar`);
        if (action) {
          const t = prompt('Nuevo título:', link.title);
          const u = prompt('Nueva URL:', link.url);
          if (t && u && u.startsWith('http')) { link.title = t; link.url = u; saveLinks(c); }
        } else {
          if(confirm('¿Seguro que quieres borrar este enlace?')) {
            c[cat] = c[cat].filter(l => l.id !== id);
            saveLinks(c);
          }
        }
      };

      window.addCategory = () => {
        const cat = prompt('Nombre de la nueva sección:');
        if(!cat) return;
        const c = loadLinks();
        if(c[cat]) return alert('Ya existe.');
        c[cat] = [];
        saveLinks(c);
      };

      window.deleteCategory = (cat) => {
        if(!confirm(`¿Borrar la sección "${cat}" y todos sus enlaces?`)) return;
        const c = loadLinks();
        delete c[cat];
        saveLinks(c);
      };


      // ==========================
      // 🔹 GESTOR DE BUSCADORES
      // ==========================
      function renderSearchEnginesEditor() {
        const engines = loadSearchEngines();
        const listEl = document.getElementById('enginesEditorList');
        let html = '';
        
        engines.forEach(eng => {
          const iconUrl = `https://www.google.com/s2/favicons?domain=${eng.domain}&sz=32`;
          html += `
            <div class="engine-list-item">
              <div class="engine-info">
                <img src="${iconUrl}" onerror="this.style.display='none'">
                <span style="font-size: 14px;">${eng.name}</span>
                ${eng.secret ? '<span class="badge-secret">Secreto</span>' : ''}
              </div>
              <div class="engine-actions">
                <button onclick="editSearchEngine('${eng.id}')" title="Editar">✏️</button>
                <button onclick="deleteSearchEngine('${eng.id}')" title="Eliminar">🗑️</button>
              </div>
            </div>
          `;
        });
        listEl.innerHTML = html;
      }

      window.addSearchEngine = () => {
        const name = prompt('Nombre del buscador (ej: Wikipedia):');
        if (!name) return;
        const url = prompt('URL de búsqueda (Asegúrate de incluir {q} donde va el texto a buscar. Ej: https://es.wikipedia.org/wiki/Special:Search?search={q}):', 'https://');
        if (!url || !url.includes('{q}')) return alert('La URL debe contener {q} para funcionar correctamente.');
        
        let domain = '';
        try { domain = new URL(url.replace('{q}', '')).hostname; } catch(e) { domain = 'google.com'; }
        
        const isSecret = confirm('¿Quieres que este buscador solo aparezca en el Modo Secreto? \n[Aceptar] = Sí \n[Cancelar] = No');
        
        const engines = loadSearchEngines();
        engines.push({ id: crypto.randomUUID(), name, url, domain, secret: isSecret });
        saveSearchEngines(engines);
      };

      window.editSearchEngine = (id) => {
        const engines = loadSearchEngines();
        const eng = engines.find(e => e.id === id);
        if(!eng) return;
        
        const newName = prompt('Editar Nombre:', eng.name);
        if (!newName) return;
        const newUrl = prompt('Editar URL (Debe contener {q}):', eng.url);
        if (!newUrl || !newUrl.includes('{q}')) return alert('URL inválida. Falta {q}');
        const newSecret = confirm('¿Debe ser Secreto? \n[Aceptar] = Sí \n[Cancelar] = No');
        
        try { eng.domain = new URL(newUrl.replace('{q}', '')).hostname; } catch(e) {}
        eng.name = newName;
        eng.url = newUrl;
        eng.secret = newSecret;
        saveSearchEngines(engines);
      };

      window.deleteSearchEngine = (id) => {
        if (!confirm('¿Seguro que quieres eliminar este buscador?')) return;
        let engines = loadSearchEngines();
        engines = engines.filter(e => e.id !== id);
        saveSearchEngines(engines);
      };


      // ==========================
      // 🔹 BUSCADOR & MODO SECRETO
      // ==========================
      const searchInput = document.getElementById('searchInput');
      const searchClear = document.getElementById('searchClear');
      const searchOptions = document.getElementById('searchOptions');
      const searchEnginesList = document.getElementById('searchEnginesList');
      const mainContent = document.getElementById('mainContent');
      
      let currentQuery = '';
      let isSecretMode = localStorage.getItem('secretMode') === 'true';

      function updateSearchUI() {
        if (isSecretMode) {
          searchInput.classList.add('secret-mode');
          searchInput.placeholder = 'Modo Secreto 🔓';
        } else {
          searchInput.classList.remove('secret-mode');
          searchInput.placeholder = 'Buscar...';
        }
        buildSearchList();
      }

      function buildSearchList() {
        const engines = loadSearchEngines();
        const visibleEngines = engines.filter(e => isSecretMode ? e.secret : !e.secret);
        
        searchEnginesList.innerHTML = visibleEngines.map(e => `
          <div class="ios-list-item ${isSecretMode ? 'secret-item' : ''}" data-url="${e.url}">
            <img src="https://www.google.com/s2/favicons?domain=${e.domain}&sz=32" />
            <span>Buscar en <b>${e.name}</b></span>
          </div>
        `).join('');
        
        searchEnginesList.querySelectorAll('.ios-list-item').forEach(item => {
          item.addEventListener('click', () => {
            if (!currentQuery) return;
            const url = item.getAttribute('data-url').replace('{q}', encodeURIComponent(currentQuery));
            window.open(url, '_blank');
          });
        });
      }

      searchInput.addEventListener('input', (e) => {
        const val = e.target.value.trim();
        
        if (val.toLowerCase() === 'xxx') {
          isSecretMode = !isSecretMode;
          localStorage.setItem('secretMode', isSecretMode);
          updateSearchUI();
          searchInput.value = '';
          closeSearch();
          return;
        }

        currentQuery = val;
        
        if (currentQuery.length > 0) {
          searchClear.style.display = 'flex';
          searchOptions.classList.add('show');
          mainContent.style.opacity = '0.3'; 
          mainContent.style.pointerEvents = 'none';
        } else {
          closeSearch();
        }
      });

      searchInput.addEventListener('keydown', (e) => {
        if(e.key === 'Enter' && currentQuery) {
          const engines = loadSearchEngines();
          const firstEngine = engines.find(e => isSecretMode ? e.secret : !e.secret);
          if (firstEngine) {
            window.open(firstEngine.url.replace('{q}', encodeURIComponent(currentQuery)), '_blank');
          }
        }
      });

      searchClear.addEventListener('click', closeSearch);

      function closeSearch() {
        searchInput.value = '';
        currentQuery = '';
        searchClear.style.display = 'none';
        searchOptions.classList.remove('show');
        mainContent.style.opacity = '1';
        mainContent.style.pointerEvents = 'auto';
        searchInput.blur();
      }

      // ==========================
      // 🔹 AEMET (Tiempo)
      // ==========================
      function initAemet() {
        applyCollapseState('widget_aemet'); // Aplicar estado de colapso al cargar
        
        const feedUrl = 'https://www.aemet.es/documentos_d/eltiempo/prediccion/avisos/rss/CAP_AFAP7703_ATOM.xml';
        const apiUrl = `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(feedUrl)}&_=${new Date().getTime()}`;
        const list = document.getElementById('avisos-lista');

        fetch(apiUrl)
          .then(r => r.ok ? r.json() : Promise.reject())
          .then(data => {
            if (data.status !== 'ok') throw new Error('API RSS Error');
            const items = data.items.filter(i => 
              !i.title.toLowerCase().includes('estado completo') && 
              !i.title.toLowerCase().includes('sin avisos')
            );
            
            if (!items.length) { 
              list.innerHTML = '<div style="padding: 10px 0;">✅ No hay avisos meteorológicos activos ahora mismo.</div>'; 
              return; 
            }
            
            let html = '';
            items.forEach(item => {
              let cleanTitle = item.title.replace(/^Aviso\.\s*Nivel\s+\w+\.\s*/i, '');
              let desc = item.description ? item.description.replace(/<[^>]*>/g, '').substring(0, 80) + '...' : '';
              const level = /rojo/i.test(item.title) ? 'nivel-rojo' : /naranja/i.test(item.title) ? 'nivel-naranja' : 'nivel-amarillo';
              
              html += `
                <div class="aviso">
                  <div class="${level}">⚠️ ${cleanTitle}</div>
                  <div style="font-size:13px; color:var(--text-secondary); margin-top:4px;">${desc}</div>
                </div>
              `;
            });
            list.innerHTML = html;
          })
          .catch(() => { 
            list.innerHTML = '<div style="padding: 10px 0;">⚠️ No se ha podido cargar la información de AEMET.</div>'; 
          });
      }

      // ==========================
      // 🔹 MENÚS AJUSTES EXPORTAR/IMPORTAR
      // ==========================
      document.getElementById('toggleEnginesBtn').addEventListener('click', () => {
        const sec = document.getElementById('enginesSection');
        sec.style.display = sec.style.display === 'none' ? 'block' : 'none';
        document.getElementById('exportSection').style.display = 'none'; // ocultar el otro
      });

      document.getElementById('toggleExportBtn').addEventListener('click', () => {
        const sec = document.getElementById('exportSection');
        sec.style.display = sec.style.display === 'none' ? 'block' : 'none';
        document.getElementById('enginesSection').style.display = 'none'; // ocultar el otro
      });

      document.getElementById('exportBtn').addEventListener('click', () => {
        // Exportamos enlaces y buscadores juntos en un solo objeto JSON
        const exportData = {
          version: 2,
          categories: loadLinks(),
          engines: loadSearchEngines()
        };
        document.getElementById('dataTextarea').value = JSON.stringify(exportData);
        document.getElementById('importStatus').innerText = "✅ Código copiado en la caja de texto.";
      });

      document.getElementById('importBtn').addEventListener('click', () => {
        const val = document.getElementById('dataTextarea').value.trim();
        try {
          const json = JSON.parse(val);
          
          if(json.categories) {
            saveLinks(json.categories); // Guarda y recarga vista
          }
          if(json.engines) {
            saveSearchEngines(json.engines); // Guarda y recarga buscadores
          }
          
          document.getElementById('importStatus').innerText = "✅ Importado con éxito.";
        } catch(e) {
          document.getElementById('importStatus').innerText = "❌ Formato incorrecto.";
        }
      });

      // Inicializar todo
      updateSearchUI();
      renderSearchEnginesEditor();
      renderLinks();
      initAemet();
    });
  </script>
</body>
</html>
