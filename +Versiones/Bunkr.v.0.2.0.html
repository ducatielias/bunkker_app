<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Menú con Subcategorías Expandibles</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: sans-serif;
    }

    /* Barra superior */
    .top-bar {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 60px;
      background-color: #333;
      color: white;
      display: flex;
      align-items: center;
      padding: 0 16px;
      z-index: 1000;
    }

    .menu-btn {
      background: none;
      border: none;
      color: white;
      font-size: 24px;
      cursor: pointer;
      margin-right: 16px;
    }

    .top-bar h1 {
      font-size: 1.2rem;
    }

    /* Overlay */
    .overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.5);
      z-index: 999;
    }

    /* Sidebar */
    .sidebar {
      position: fixed;
      top: 0;
      left: -280px;
      width: 280px;
      height: 100vh;
      background-color: #222;
      color: white;
      transition: left 0.3s ease;
      z-index: 1001;
      overflow: hidden;
    }

    .sidebar.open {
      left: 0;
    }

    .sidebar-content {
      height: 100vh;
      overflow-y: auto;
    }

    /* Header del sidebar */
    .sidebar-header {
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding: 0 16px;
      background-color: #111;
      border-bottom: 1px solid #444;
    }

    .sidebar-header button {
      background: none;
      border: none;
      color: white;
      font-size: 24px;
      cursor: pointer;
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Estilos para los elementos del menú */
    .menu-item {
      width: 100%;
      background: transparent;
      border: none;
      color: white;
      text-align: left;
      font-size: 1rem;
      cursor: pointer;
      border-bottom: 1px solid #444;
      padding: 14px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .menu-item:hover {
      background-color: #444;
    }

    .menu-item .arrow {
      transition: transform 0.25s ease;
      font-size: 16px;
    }

    .menu-item.expanded .arrow {
      transform: rotate(90deg);
    }

    /* Submenú */
    .submenu {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.3s ease;
      background-color: #2a2a2a;
    }

    .submenu.open {
      max-height: 500px; /* suficiente para varios items; ajustable */
    }

    .submenu button {
      display: block;
      width: 100%;
      padding: 12px 40px; /* sangría visual */
      background: transparent;
      border: none;
      color: #ccc;
      text-align: left;
      font-size: 0.95rem;
      cursor: pointer;
    }

    .submenu button:hover {
      background-color: #3a3a3a;
      color: white;
    }

    /* Contenido principal */
    .main-content {
      margin-top: 60px;
      padding: 20px;
    }

    @media (max-width: 480px) {
      .top-bar, .sidebar-header {
        height: 56px;
      }
      .sidebar {
        width: 240px;
      }
      .main-content {
        padding: 16px;
      }
    }
  </style>
</head>
<body>

  <header class="top-bar">
    <button class="menu-btn" id="menuToggle">☰</button>
    <h1>Mi App</h1>
  </header>

  <div class="overlay" id="overlay"></div>

  <nav class="sidebar" id="sidebar">
    <div class="sidebar-content">
      <div class="sidebar-header">
        <button id="closeSidebar">×</button>
      </div>

      <div class="sidebar-menu">
        <button class="menu-item" data-target="submenu-1">
          Inicio <span class="arrow">▶</span>
        </button>
        <div id="submenu-1" class="submenu">
          <button>Inicio rápido</button>
          <button>Últimos accesos</button>
        </div>

        <button class="menu-item" data-target="submenu-2">
          Buscar <span class="arrow">▶</span>
        </button>
        <div id="submenu-2" class="submenu">
          <button>Por nombre</button>
          <button>Por categoría</button>
          <button>Avanzado</button>
        </div>

        <button class="menu-item" data-target="submenu-3">
          Favoritos <span class="arrow">▶</span>
        </button>
        <div id="submenu-3" class="submenu">
          <button>Estrellas</button>
          <button>Pins</button>
        </div>

        <button class="menu-item" data-target="submenu-4">
          Ajustes <span class="arrow">▶</span>
        </button>
        <div id="submenu-4" class="submenu">
          <button>Tema</button>
          <button>Idioma</button>
          <button>Seguridad</button>
          <button>Copias de seguridad</button>
        </div>

        <button class="menu-item">
          Acerca de <span class="arrow"></span>
        </button>

        <button class="menu-item">
          Cerrar sesión <span class="arrow"></span>
        </button>
      </div>
    </div>
  </nav>

  <main class="main-content">
    <h2>Bienvenido</h2>
    <p>Los elementos con <b>▶</b> tienen submenús expandibles.</p>
    <p>Haz clic para probar. El sidebar conserva scroll si es largo.</p>
    <p style="margin-top: 400px;">Más contenido para probar scroll…</p>
  </main>

  <script>
    // Sidebar
    const menuToggle = document.getElementById('menuToggle');
    const closeSidebar = document.getElementById('closeSidebar');
    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('overlay');

    function openMenu() {
      sidebar.classList.add('open');
      overlay.style.display = 'block';
      document.body.style.overflow = 'hidden';
    }

    function closeMenu() {
      sidebar.classList.remove('open');
      overlay.style.display = 'none';
      document.body.style.overflow = '';
    }

    menuToggle.addEventListener('click', openMenu);
    closeSidebar.addEventListener('click', closeMenu);
    overlay.addEventListener('click', closeMenu);

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && sidebar.classList.contains('open')) {
        closeMenu();
      }
    });

    // Expansión/contracción de submenús
    document.querySelectorAll('.menu-item[data-target]').forEach(btn => {
      btn.addEventListener('click', function () {
        const targetId = this.getAttribute('data-target');
        const submenu = document.getElementById(targetId);
        const isExpanded = this.classList.contains('expanded');

        // Cerrar otros submenús
        document.querySelectorAll('.menu-item').forEach(el => el.classList.remove('expanded'));
        document.querySelectorAll('.submenu').forEach(el => el.classList.remove('open'));

        if (!isExpanded) {
          this.classList.add('expanded');
          submenu.classList.add('open');
        }
      });
    });
  </script>

</body>
</html>
