<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8">
    <title>The circular menu</title>
    <link rel="stylesheet" href="./style.css">
    
    <style>
      /*@import url("https://fonts.googleapis.com/css?family=Crimson+Text&display=swap");
      @import url("https://fonts.googleapis.com/css?family=Work+Sans&display=swap");*/
      
      body {
        background: #ffffff;
        height: 100vh;
        margin: 0 20px;
      }
      /*=== MENU - HAMBURGUER ===*/
      .menu {
        -webkit-tap-highlight-color: transparent;
        background: #fff;
        border-radius: 50%;
        box-shadow: 0 0 4px 5px rgba(0, 0, 0, 0.2);
        cursor: pointer;
        height: 200px;
        left: -100px;
        position: absolute;
        top: -100px;
        width: 200px;
      }
      .hamburger {
        cursor: pointer;
        height: 46px;
        left: 58%;
        position: relative;
        top: 58%;
        width: 46px;
      }
      .hamburger path {
        transition: transform 300ms;
      }
      .hamburger path:nth-child(1) {
        transform-origin: 25% 29%;
      }
      .hamburger path:nth-child(2) {
        transform-origin: 50% 50%;
      }
      .hamburger path:nth-child(3) {
        transform-origin: 75% 72%;
      }
      .hamburger path:nth-child(4) {
        transform-origin: 75% 29%;
      }
      .hamburger path:nth-child(5) {
        transform-origin: 25% 72%;
      }
      .active .pie {
        transform: translateX(0) translateY(0);
      }
      .active .hamburger path:nth-child(1) {
        transform: rotate(45deg);
      }
      .active .hamburger path:nth-child(2) {
        transform: scaleX(0);
      }
      .active .hamburger path:nth-child(3) {
        transform: rotate(45deg);
      }
      .active .hamburger path:nth-child(4) {
        transform: rotate(-45deg);
      }
      .active .hamburger path:nth-child(5) {
        transform: rotate(-45deg);
      }
      /*=== MENU - ELEMENTOS ===*/
      .pie {
        -webkit-tap-highlight-color: transparent;
        background: #000;
        border-radius: 50%;
        box-shadow: 0 0 4px 5px rgba(0, 0, 0, 0.2);
        cursor: pointer;
        height: 400px;
        left: -200px;
        position: absolute;
        top: -200px;
        width: 400px;
        transform: translateX(-200px) translateY(-200px);
        transition: transform 300ms;
      }
      .pie-color:hover {
        opacity: 0.85;
      }
      .pie-color:active {
        opacity: 0.7;
      }
      
      .pie1 {
        -webkit-clip-path: polygon(200px 200px, 344px 450px, 0 450px);
                clip-path: polygon(200px 200px, 344px 450px, 0 450px);
        transition-delay: 30ms;
      }
      .pie2 {
        -webkit-clip-path: polygon(200px 200px, 344px 450px, 450px 344px);
                clip-path: polygon(200px 200px, 344px 450px, 450px 344px);
        transition-delay: 60ms;
      }
      .pie3 {
        -webkit-clip-path: polygon(200px 200px, 450px 0, 450px 344px);
                clip-path: polygon(200px 200px, 450px 0, 450px 344px);
        transition-delay: 90ms;
      }
      .pie-color {
        width: 100%;
        height: 100%;
        border-radius: 50%;
      }
      .pie-color1 {
        background: linear-gradient(135deg, #f12711, #f5af19);
        -webkit-clip-path: polygon(200px 200px, 344px 450px, 0 450px);
                clip-path: polygon(200px 200px, 344px 450px, 0 450px);
      }
      .pie-color2 {
        background: linear-gradient(135deg, #444, #7e84f9);
        -webkit-clip-path: polygon(200px 200px, 344px 450px, 450px 344px);
                clip-path: polygon(200px 200px, 344px 450px, 450px 344px);
      }
      .pie-color3 {
  background: linear-gradient(135deg, #444, #b7e13f);
  -webkit-clip-path: polygon(200px 200px, 450px 0, 450px 344px);
          clip-path: polygon(200px 200px, 450px 0, 450px 344px);
}
      .card1 {
        left: 190px;/*216*/
        position: absolute;
        top: 300px;
        width: 46px;
      }
      .card2 {
        left: 260px;/*288*/
        position: absolute;
        top: 258px;
        width: 46px;
      }
      .card3 {
        left: 300px;/*324*/
        position: absolute;
        top: 188px;/*188*/
        width: 46px;
      }
      
      
      /*=== DISPLAY_BODY ===*/
      .title {
        color: #3d00ff;
        font-family: "Crimson Text", serif;
        font-size: 80px;
        line-height: 84px;
        margin-top: 60px;
        text-align: center;
      }
      .display_body {
        color: black;
        font-family: "Work Sans", sans-serif;
        font-size: 20px;
        justify-content: center;
        line-height: 28px;
        margin: 30px auto;
        max-width: 600px;
        text-align: center;
      }
      

    </style>
  </head>
    
  <body>
  <!-- === MENU - ELEMENTOS === -->
  <div class="pie pie1" onclick="document.body.classList.remove('active')">
    <div class="pie-color pie-color1">
      <span class="card1" style="display: inline-flex; align-items: center; justify-content: center; width: 100px; height: 100px; font-size: 56px;">🔚</span>
    </div>
  </div>
  <div class="pie pie2" onclick="document.body.classList.remove('active')">
    <div class="pie-color pie-color2">
      <span class="card2" style="display: inline-flex; align-items: center; justify-content: center; width: 100px; height: 100px; font-size: 56px;">⚙️</span>
    </div>
  </div>
  <div class="pie pie3" onclick="document.body.classList.remove('active')">
    <div class="pie-color pie-color3">
      <span class="card3" style="display: inline-flex; align-items: center; justify-content: center; width: 100px; height: 100px; font-size: 56px;">⟰</span>
    </div>
  </div>
  <!-- === MENU - HAMBURGUER === -->
  <div class="menu" onclick="document.body.classList.toggle('active')">
    <svg class="hamburger" xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100">
          <g
            fill="none"
            stroke="#000"
            stroke-width="7.999"
            stroke-linecap="round"
          >
            <path d="M 55,26.000284 L 24.056276,25.999716" />
            <path d="M 24.056276,49.999716 L 75.943724,50.000284" />
            <path d="M 45,73.999716 L 75.943724,74.000284" />
            <path d="M 75.943724,26.000284 L 45,25.999716" />
            <path d="M 24.056276,73.999716 L 55,74.000284" />
          </g>
        </svg>
  </div>
    
  <!-- === DISPLAY_BODY === -->
  <div class="title">The circular menu</div>
  <div class="display_body">
    Loreen Epson dollar sin Ahmet, consecutive advertisment elite, seed do equivocal temper
  </div>
    
  <h2>🌤️ Buscar clima</h2>
  <p>Escribe ciudad, estado o país:</p>

  <form id="windyForm">
    <input type="text" id="locationInput" placeholder="Ej: Madrid..." autocomplete="off" required />
    <button type="submit">Ver en Windy</button>
  </form>
  <div id="status"></div>
  <div id="result"></div>
    <div id="resultAEMET"></div>

  <script>
    const form = document.getElementById('windyForm');
    const input = document.getElementById('locationInput');
    const statusDiv = document.getElementById('status');
    const resultDiv = document.getElementById('result');
    const resultDivAEMET = document.getElementById('resultAEMET');

    form.addEventListener('submit', async function(e) {
      e.preventDefault();
      const query = input.value.trim();
      if (!query) return alert('Ingresa una ubicación.');

      statusDiv.textContent = 'Buscando…';
      resultDiv.textContent = 'Buscando…';
      resultDivAEMET.textContent = 'Buscando…';

      try {
        // Llamada a Nominatim (OpenStreetMap)
        const url = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&limit=1`;
        const res = await fetch(url, {
          headers: { 'User-Agent': 'Windy-Search-Tool' } // Requerido por Nominatim
        });

        const data = await res.json();

        if (!data || data.length === 0) {
          statusDiv.textContent = '❌ Ubicación no encontrada.';
          return;
        }

        const { lat, lon, display_name } = data[0];
        
        const windyUrl = `https://www.windy.com/${lat}/${lon}?38.538,-0.394,11`; //const windyUrl = `https://www.windy.com/?${lat},${lon}`; 

        
        statusDiv.textContent = `✅ Encontrado: ${display_name} \nLatitud:${lat}\nLongitud:${lon}`;
        
        // Mostrar el texto con el enlace 
        resultDiv.innerHTML = `
          ✅ <strong>WINDY:</strong> <a href="${windyUrl}" target="_blank">
            ${display_name}
          </a>
        `;
        
        //AEMET
        //const query = input.value.trim();
        //if (!query) return;

        // Codificamos para URL (espacios → %20, etc.)
        const encoded = encodeURIComponent(query);
        const aemetUrl = `https://www.aemet.es/es/buscador?str=${encoded}&modo=and&orden=n&tipo=sta`;

        // Mostramos el resultado como enlace (sin abrir)
        resultDivAEMET.innerHTML = `
          ✅ <strong>AEMET:</strong> <a href="${aemetUrl}" target="_blank">
            Resultados para: ${query}
          </a>
        `;
        //AEMET
        
        //window.open(windyUrl, '_blank');
      } 
      catch (err) {
        console.error(err);
        statusDiv.textContent = '⚠️ Error al buscar. ¿Estás conectado a internet?';
      }
      
      
      
    });
  </script>
    


  



  </body>
  
</html>
