<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Bunkr Searcher</title>
  
  <style>
    /* === Reset & Base === */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #f9fafb;
      color: #374151;
      line-height: 1.5;
      min-height: 100vh;
    }

    main {
      max-width: 768px;
      width: 100%;
      margin: 0 auto;
      padding: 1.25rem 1rem;
    }

    /* === Search Box === */
    .search-box {
      background-color: white;
      border-radius: 0.75rem;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.06);
      padding: 1.25rem 1rem;
      margin-bottom: 1.25rem;
    }

    .search-box h1 {
      font-size: 1.75rem;
      font-weight: 700;
      color: #ef4444;
      margin: 0 0 0.25rem;
    }

    .search-box p {
      font-size: 0.9375rem;
      color: #4b5563;
      margin: 0 0 1rem;
    }

    /* === Search Box - Input con botón integrado === */
    .search-input-wrapper {
      position: relative;
      width: 100%;
    }

    .search-input {
      width: 100%;
      padding: 0.75rem 2.75rem 0.75rem 1rem;
      font-size: 1rem;
      border: 1px solid #d1d5db;
      border-radius: 0.5rem;
      outline: none;
      background-color: white;
      transition: all 0.2s ease;
    }

    .search-input:focus {
      border-color: #ef4444;
      box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.2);
    }

    .search-button-inline {
      position: absolute;
      right: 0.75rem;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: #6b7280;
      cursor: pointer;
      padding: 0.25rem;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 24px;
      height: 24px;
    }

    .search-button-inline:hover {
      color: #ef4444;
    }

    .search-button-inline svg {
      width: 18px;
      height: 18px;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* === Search Box - Search Options Grid === */
    .search-options {
      display: none;
      margin-top: 1rem;
      gap: 0.5rem;
      grid-template-columns: repeat(2, 1fr);
    }

    .search-options.show {
      display: grid;
    }

    @media (min-width: 640px) {
      .search-options {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    @media (min-width: 768px) {
      .search-options {
        grid-template-columns: repeat(5, 1fr);
      }
    }

    .search-option {
      background-color: white;
      border: 1px solid #e5e7eb;
      color: #374151;
      font-size: 0.8125rem;
      padding: 0.75rem 0.5rem;
      border-radius: 0.5rem;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.25rem;
      transition: all 0.15s ease;
      min-height: 72px;
    }

    .search-option:hover {
      border-color: #ef4444;
      color: #ef4444;
      transform: translateY(-2px);
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }

    .search-option svg {
      width: 1.25rem;
      height: 1.25rem;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* === Mobile-friendly scroll behavior === */
    @media (max-width: 767px) {
      html {
        scroll-behavior: auto;
      }
    }
    
    /* === Search Box - Sections & Titles === */
    .search-section {
      margin-bottom: 1.5rem;
    }

    .section-title {
      font-size: 0.875rem;
      font-weight: 700;
      color: #4b5563;
      margin: 0 0 0.75rem;
      padding-bottom: 0.25rem;
      border-bottom: 1px solid #e5e7eb;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .section-content {
      display: grid;
      gap: 0.5rem;
      grid-template-columns: 1fr !important; /* Una sola columna → uno debajo del otro */
    }

    
  </style>
  
</head>
  
<body>
  <main>
    <section>
      <div class="search-box">
        <h1>Bunkr Searcher</h1>
        <p>Find what you're looking for on Bunkr</p>

        <form id="searchForm" class="search-form">
          <div class="search-input-wrapper">
            <input
              type="text"
              id="searchInput"
              placeholder="Search on Bunkr..."
              class="search-input"
              autocomplete="off"
              autocapitalize="off"
              spellcheck="false"
              required
            />
            <button type="submit" class="search-button-inline" aria-label="Search">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
              </svg>
            </button>
          </div>
        </form>

        <div id="searchOptions" class="search-options">
          <!-- Sección: Datos / Hosting -->
          <div class="search-section">
            <h3 class="section-title">📁 DATOS</h3>
            <div class="section-content">
              <button class="search-option" data-site="bunkr">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                  <circle cx="12" cy="12" r="10"></circle>
                </svg>
                <span>Bunkr Albums</span>
              </button>
            </div>
          </div>

          <!-- Sección: Motores de búsqueda -->
          <div class="search-section">
            <h3 class="section-title">🔍 Motores de búsqueda</h3>
            <div class="section-content">
              <button class="search-option" data-site="yandex">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                  <circle cx="11" cy="11" r="8"></circle>
                  <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
                <span>Yandex</span>
              </button>
              <button class="search-option" data-site="google">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                  <circle cx="12" cy="12" r="10"></circle>
                  <line x1="2" y1="12" x2="22" y2="12"></line>
                  <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
                </svg>
                <span>Google</span>
              </button>
              <button class="search-option" data-site="bing">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                  <circle cx="11" cy="11" r="8"></circle>
                  <line x1="3" y1="21" x2="21" y2="9"></line>
                </svg>
                <span>Bing</span>
              </button>
            </div>
          </div>

          <!-- Sección: Redes sociales -->
          <div class="search-section">
            <h3 class="section-title">📱 Redes sociales</h3>
            <div class="section-content">
              <button class="search-option" data-site="vk">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                  <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                  <circle cx="9" cy="7" r="4"></circle>
                  <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
                  <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
                </svg>
                <span>VK</span>
              </button>
              <button class="search-option" data-site="telegram">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                  <path d="M22 2 11 12"></path>
                  <path d="m16 6 -2 13 -4 -8 -6 7 13 -7"></path>
                </svg>
                <span>Telegram</span>
              </button>
            </div>
          </div>
        </div>
        
      </div>
    </section>
  </main>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const searchForm = document.getElementById('searchForm');
      const searchInput = document.getElementById('searchInput');
      const searchOptions = document.getElementById('searchOptions');

      let currentQuery = '';

      searchForm.addEventListener('submit', (e) => {
        e.preventDefault();
        currentQuery = searchInput.value.trim();
        if (!currentQuery) return;

        searchOptions.classList.add('show');

        const behavior = window.matchMedia('(hover: hover)').matches ? 'smooth' : 'auto';
        searchOptions.scrollIntoView({ behavior, block: 'start' });
      });

      document.querySelectorAll('.search-option').forEach(button => {
        button.addEventListener('click', () => {
          const site = button.dataset.site;
          const q = encodeURIComponent(currentQuery);
          let url = '';

          switch (site) {
            case 'bunkr':
              url = `https://bunkr-albums.io/?search=${q}`;
              break;
            case 'yandex':
              url = `https://yandex.com/search/?text=${q}`;
              break;
            case 'google':
              url = `https://www.google.com/search?q=${q}`;
              break;
            case 'bing':
              url = `https://www.bing.com/search?q=${q}`;
              break;
            case 'vk':
              url = `https://vk.com/search?q=${q}`;
              break;
            case 'telegram':
              url = `https://tgsearch.su/?post_type=tg_channel&s=${q}`;
              break;
            default:
              return;
          }

          if (url) {
            window.open(url, '_blank', 'noopener,noreferrer');
          }
        });
      });
    });
  </script>
  
  
</body>
</html>
